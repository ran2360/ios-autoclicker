name: build-tweak

# 在 GitHub 的 macOS runner 上用 theos 构建插件。
# 必须包含 arm64e 切片，所以必须用 macOS runner。

on:
  push:
    paths:
      - 'src/**'
      - 'theos/**'
      - '.github/workflows/build-tweak.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    env:
      # 把工具链放在单独的目录，避免和仓库里的 theos 文件夹冲突
      THEOS: ${{ github.workspace }}/theos-toolchain

    steps:
      - uses: actions/checkout@v4

      - name: 安装 theos (roothide 分支)
        run: |
          git clone --recursive --depth 1 https://github.com/roothide/theos.git "$THEOS"
          "$THEOS/bin/install-theos" || true
          ls "$THEOS" | head

      # 【新增】安装 ldid，解决 command not found 问题
      - name: 安装 ldid
        run: brew install ldid

      - name: 准备源码 (theos 工程需要源文件在工程目录里)
        run: |
          cp src/JDClickerSB.m     theos/JDClickerSB.m
          cp src/JDClickerSB.plist theos/JDClickerSB.plist
          ls -l theos/

      - name: 构建 (隐根 + 无根)
        run: |
          # 【新增】把 theos 的 bin 目录加入 PATH，让系统能找到 ldid
          export PATH="$THEOS/bin:$PATH"
          cd theos
          for scheme in roothide rootless; do
            echo "===== building scheme=$scheme ====="
            make clean || true
            make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=$scheme
          done

      - name: 校验产物切片 (必须同时有 arm64 和 arm64e)
        run: |
          cd theos
          for d in packages/*.deb; do
            echo "== $d =="
            dpkg-deb -c "$d" | grep -E 'dylib|plist' || true
            tmp=$(mktemp -d)
            dpkg-deb -x "$d" "$tmp"
            find "$tmp" -name '*.dylib' -exec lipo -info {} \; || true
            find "$tmp" -name '*.dylib' -exec sh -c 'lipo -detailed_info "$1" | head -30' _ {} \; || true
          done

      - uses: actions/upload-artifact@v4
        with:
          name: jdclickersb-debs
          path: theos/packages/*.deb
          if-no-files-found: error
